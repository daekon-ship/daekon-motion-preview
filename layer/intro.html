<style>
/* Betöltő (a tulajdonos kérésére a gt-lakasfelujitas.hu betöltőjének mintájára): sötét függöny, a DAEKON felirat
   alulról becsúszik, alatta lime–lila vonal töltődik ki, majd az alcím; utána a függöny felfelé letörlődik.
   Csökkentett mozgásnál és ?dkm=0 mellett nem jelenik meg; legkésőbb 5 mp után CSS-ből is eltűnik. */
#dkm-intro{position:fixed;inset:0;z-index:2147482000;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;clip-path:inset(0);transition:clip-path .9s cubic-bezier(.76,0,.24,1);animation:dkm-intro-safety 0s linear 5s forwards;pointer-events:none}
#dkm-intro.out{clip-path:inset(0 0 100%)}
#dkm-intro b{display:block;overflow:hidden;font:600 clamp(22px,2.6vw,30px)/1.15 Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.34em;margin-right:-.34em;color:#F5F5F2}
#dkm-intro b span{display:inline-block;transform:translateY(110%);animation:dkm-intro-up .9s cubic-bezier(.16,1,.3,1) .12s forwards}
#dkm-intro i{display:block;position:relative;overflow:hidden;width:min(320px,60vw);height:1px;background:rgba(245,245,242,.12)}
#dkm-intro i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#C4B5FD,#B9A2FF);transform:scaleX(0);transform-origin:left;animation:dkm-intro-line 1s cubic-bezier(.65,0,.35,1) .32s forwards}
#dkm-intro small{font:500 10px/1.4 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.22em;text-transform:uppercase;color:#8E8D88;opacity:0;text-align:center;padding:0 16px;animation:dkm-intro-fade .6s ease .7s forwards}
@keyframes dkm-intro-up{to{transform:none}}
@keyframes dkm-intro-line{to{transform:scaleX(1)}}
@keyframes dkm-intro-fade{to{opacity:1}}
@keyframes dkm-intro-safety{to{visibility:hidden}}
@media (max-width:480px){#dkm-intro small{font-size:9.5px;letter-spacing:.12em}}
@media (prefers-reduced-motion:reduce){html:not(.dkm-force) #dkm-intro{display:none}}
/* JS nélkül a betöltő nem takarhat (2026-10-28): a .js osztályt az oldal fejlécének inline szkriptje adja; nélküle a
   függöny eddig a CSS-es biztonsági időzítőig (5 mp) eltakarta a tartalmat */
html:not(.js) #dkm-intro{display:none}
</style>
<div id="dkm-intro" aria-hidden="true"><b><span>DAEKON</span></b><i></i><small>Weboldalak · Webalkalmazások · Egyedi rendszerek</small></div>
<script>
;(function () {
  var el = document.getElementById('dkm-intro')
  if (!el) return
  var q = new URLSearchParams(location.search)
  var sysReduced = matchMedia('(prefers-reduced-motion: reduce)').matches
  // kifejezett kérésre (?dkmmotion=1) a betöltő is látszik csökkentett mozgás mellett (a CSS ezt a dkm-force osztályból tudja)
  if (sysReduced && q.get('dkmmotion') === '1') document.documentElement.classList.add('dkm-force')
  var reduced = sysReduced && q.get('dkmmotion') !== '1'
  if (q.get('dkm') === '0' || reduced) return el.remove()
  var t0 = Date.now()
  var done = false
  // 2026-10-28: nincs mesterséges várakozás. A függöny akkor megy fel, amikor a réteg bekapcsolt (a hero kész, a
  // stílusváltás így nem látszik) – nem vár a teljes oldalbetöltésre (képek) és nincs 1,3 mp-es minimum.
  // Ha a réteg valamiért nem kapcsolna be, legkésőbb ~4,5 mp-nél akkor is felmegy (biztonsági plafon, nem várakozás:
  // a korábbi 3,2 mp-es plafonnál lassú telefonon a függöny néha a bekapcsolás ELŐTT ment fel, és a stílusváltás látszott).
  function on() { return document.documentElement.classList.contains('dkm') }
  function out() {
    if (done) return
    if (!on() && Date.now() - t0 < 4500) return void setTimeout(out, 40)
    done = true
    requestAnimationFrame(function () {
      el.classList.add('out')
      setTimeout(function () { el.remove() }, 950)
    })
  }
  // a réteg a bekapcsolás pillanatában közvetlenül szól (layer/dkm.js), így nincs lekérdezési késés
  window.__dkmCurtain = out
  out()
})()
</script>
